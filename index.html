<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Jurídico - Lic. Cesar Adriano</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --azul-premium: #0d1b2a;
            --dorado-metalico: #c5a059;
            --blanco-puro: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            
            /* CONFIGURACIÓN DEL MÁRMOL PERSONALIZADO */
            background-image: 
                linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%, rgba(255,255,255,0.2) 100%), /* CAPA DE BRILLO */
                url('marmol.jpg'); /* <--- CAMBIA AQUÍ EL NOMBRE DE TU ARCHIVO */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* CAPA DE PROFUNDIDAD (Para que el texto resalte sobre el mármol) */
        .overlay-brillo {
            width: 100%;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: contrast(110%) brightness(105%); /* Mejora el "acabado" visual */
        }

        /* CABECERA Y LOGO */
        .cabecera {
            padding: 30px 0;
            text-align: center;
        }

        .logo-contenedor {
            width: 220px; /* Tamaño controlado para que no se vea "gigante" */
            margin: 0 auto;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
        }

        .logo-contenedor img {
            width: 100%;
            height: auto;
        }

        /* TARJETA CENTRAL */
        .tarjeta-identidad {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 40px 20px;
            text-align: center;
            border-top: 4px solid var(--dorado-metalico);
            border-bottom: 4px solid var(--dorado-metalico);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .nombre-abogado {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--azul-premium);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .divisor {
            margin: 20px auto;
            width: 60%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--dorado-metalico), transparent);
        }

        .lemas {
            font-weight: 700;
            color: var(--azul-premium);
            letter-spacing: 3px;
            line-height: 1.5;
            font-size: 1.1rem;
        }

        /* SERVICIOS */
        .seccion-servicios {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .caja-servicio {
            background: var(--blanco-puro);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(197, 160, 89, 0.3);
            transition: 0.3s;
        }

        .caja-servicio:hover { transform: translateY(-5px); }
        .caja-servicio i { font-size: 2.5rem; color: var(--dorado-metalico); margin-bottom: 15px; }

        /* BARRA DE CONTACTO INFERIOR */
        .contacto-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: var(--azul-premium);
        }

        .item-contacto {
            padding: 20px 10px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .item-contacto i { display: block; font-size: 1.8rem; margin-bottom: 5px; }

        @media (max-width: 700px) {
            .contacto-footer { grid-template-columns: repeat(2, 1fr); position: relative; }
        }
    </style>
</head>
<body>

<div class="overlay-brillo">
    <header class="cabecera">
        <div class="logo-contenedor">
            <img src="logo.png" alt="Logo">
        </div>
    </header>

    <main class="tarjeta-identidad">
        <h1 class="nombre-abogado">LIC. CESAR ADRIANO</h1>
        <div class="divisor"></div>
        <p class="lemas">JUICIOS CIVILES, MERCANTILES Y FAMILIARES<br>AMPARO</p>
    </main>

    <section class="seccion-servicios">
        <div class="caja-servicio">
            <i class="fa-solid fa-balance-scale"></i>
            <h3>CIVIL</h3>
        </div>
        <div class="caja-servicio">
            <i class="fa-solid fa-briefcase"></i>
            <h3>MERCANTIL</h3>
        </div>
        <div class="caja-servicio">
            <i class="fa-solid fa-users-rays"></i>
            <h3>FAMILIAR</h3>
        </div>
        <div class="caja-servicio">
            <i class="fa-solid fa-gavel"></i>
            <h3>AMPARO</h3>
        </div>
    </section>

    <nav class="contacto-footer">
        <a href="https://wa.me/526251101156" class="item-contacto">
            <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> WHATSAPP
        </a>
        <a href="tel:6251101156" class="item-contacto">
            <i class="fa-solid fa-phone" style="color: #c5a059;"></i> LLAMAR
        </a>
        <a href="#" class="item-contacto">
            <i class="fa-solid fa-location-dot" style="color: #ff5a5f;"></i> UBICACIÓN
        </a>
        <a href="#" class="item-contacto">
            <i class="fa-solid fa-address-book"></i> GUARDAR
        </a>
    </nav>
</div>

</body>
</html>
